<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1b2a3a">
  <meta name="apple-mobile-web-app-title" content="One Last Walk">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>One Last Walk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game-canvas"></canvas>

    <div id="btn-mute" class="mute-button">Sound on</div>

    <div id="touch-controls">
      <div class="touch-zone" id="btn-left" aria-label="Move left">&#9664;</div>
      <div class="touch-zone" id="btn-right" aria-label="Move right">&#9654;</div>
      <div id="btn-action" class="action-button hidden"></div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="barnaby.js"></script>
  <script src="meadow-art.js"></script>
  <script src="dialogue.js"></script>
  <script src="util.js"></script>
  <script src="maya-adult.js"></script>
  <script src="meadow.js"></script>
  <script src="bench.js"></script>
  <script src="hill.js"></script>
  <script src="game.js"></script>
  <script>
    // Lets the game work offline, where the browser supports it
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
